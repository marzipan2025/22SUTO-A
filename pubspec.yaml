name: suto_a
description: "22SUTO-A — Supertonic 3 on-device TTS for Android"
publish_to: 'none'
version: 0.0.6+6

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.6.0
  path_provider: ^2.1.1
  just_audio: ^0.10.5
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/onnx/
    - assets/voice_styles/
  fonts:
    # Panchang (Indian Type Foundry, Fontshare) — 숫자·영문 표시용.
    # 한글 자형이 없어 본문에는 쓰지 않는다.
    - family: Panchang
      fonts:
        - asset: assets/fonts/Panchang-Regular.otf
          weight: 400
        - asset: assets/fonts/Panchang-Medium.otf
          weight: 500
        - asset: assets/fonts/Panchang-Semibold.otf
          weight: 600
        - asset: assets/fonts/Panchang-Bold.otf
          weight: 700
