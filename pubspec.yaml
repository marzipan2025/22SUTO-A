name: suto_a
description: "22SUTO-A — Supertonic 3 on-device TTS for Android"
publish_to: 'none'
version: 0.4.11+40

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.6.0
  path_provider: ^2.1.1
  just_audio: ^0.10.5
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/onnx/
    - assets/voice_styles/
    - assets/char/
    - assets/char/full/
  fonts:
    # 에이투지체 SemiBold — 본문 기본 글꼴. 한 벌만 넣는다.
    # 한글 11,172자를 모두 덮는다. 굵기를 나누지 않으므로 본문 어디에도
    # fontWeight 를 주지 않아야 이 한 벌이 그대로 나온다.
    - family: A2Z
      fonts:
        - asset: assets/fonts/A2Z-SemiBold.ttf
    # Panchang (Indian Type Foundry, Fontshare) — 숫자·영문 표시용.
    # 한글 자형이 없어 본문에는 쓰지 않는다.
    - family: Panchang
      fonts:
        - asset: assets/fonts/Panchang-Regular.otf
          weight: 400
        - asset: assets/fonts/Panchang-Medium.otf
          weight: 500
        - asset: assets/fonts/Panchang-Semibold.otf
          weight: 600
        - asset: assets/fonts/Panchang-Bold.otf
          weight: 700
