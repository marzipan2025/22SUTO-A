name: suto_a
description: "22SUTO-A — Supertonic 3 on-device TTS for Android"
publish_to: 'none'
version: 0.0.8+8

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.6.0
  path_provider: ^2.1.1
  just_audio: ^0.10.5
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/onnx/
    - assets/voice_styles/
  fonts:
    # JTBC 고딕 — 본문 기본 글꼴.
    # 이 맥에 깔린 JTBC 중 가장 가벼운 Light(usWeightClass 300) 한 벌만 쓴다.
    # 본문은 Light 로 읽으므로 그 한 벌을 400(기본 무게) 자리에 앉혔다.
    # 더 굵은 무게를 부르면 기기가 이 자형을 굵게 흉내 내 그린다.
    - family: JTBC
      fonts:
        - asset: assets/fonts/JTBCGothic-Light.ttf
          weight: 400
    # Panchang (Indian Type Foundry, Fontshare) — 숫자·영문 표시용.
    # 한글 자형이 없어 본문에는 쓰지 않는다.
    - family: Panchang
      fonts:
        - asset: assets/fonts/Panchang-Regular.otf
          weight: 400
        - asset: assets/fonts/Panchang-Medium.otf
          weight: 500
        - asset: assets/fonts/Panchang-Semibold.otf
          weight: 600
        - asset: assets/fonts/Panchang-Bold.otf
          weight: 700
