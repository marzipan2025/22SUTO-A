name: suto_a
description: "22SUTO-A — Supertonic 3 on-device TTS for Android"
publish_to: 'none'
version: 0.5.12+54

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.6.0
  path_provider: ^2.1.1
  just_audio: ^0.10.5
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    # 모델(assets/onnx, assets/voice_styles)은 앱에 넣지 않는다.
    # 400MB 라 앱을 고칠 때마다 함께 받게 되어, 갱신이 480MB 가 됐다.
    # 이제 lib/model_store.dart 가 Hugging Face 에서 따로 받아 둔다.
    - assets/char/
    - assets/char/full/
    # 첫 화면의 로고. 원본은 같은 폴더의 splash_title.svg 인데, 40px 격자
    # 위의 사각형뿐이라 13x9 픽셀 PNG 로 그대로 옮겼다 — svg 를 읽는 짐을
    # 지지 않고도 어느 크기로 키우든 픽셀이 또렷하다(FilterQuality.none).
    - assets/logo/
  fonts:
    # 에이투지체 SemiBold — 본문 기본 글꼴. 한 벌만 넣는다.
    # 한글 11,172자를 모두 덮는다. 굵기를 나누지 않으므로 본문 어디에도
    # fontWeight 를 주지 않아야 이 한 벌이 그대로 나온다.
    - family: A2Z
      fonts:
        - asset: assets/fonts/A2Z-SemiBold.ttf
    # Panchang (Indian Type Foundry, Fontshare) — 숫자·영문 표시용.
    # 한글 자형이 없어 본문에는 쓰지 않는다.
    - family: Panchang
      fonts:
        - asset: assets/fonts/Panchang-Regular.otf
          weight: 400
        - asset: assets/fonts/Panchang-Medium.otf
          weight: 500
        - asset: assets/fonts/Panchang-Semibold.otf
          weight: 600
        - asset: assets/fonts/Panchang-Bold.otf
          weight: 700
