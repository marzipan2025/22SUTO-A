name: suto_a
description: "22SUTO-A — Supertonic 3 on-device TTS for Android"
publish_to: 'none'
version: 0.0.5+5

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.6.0
  path_provider: ^2.1.1
  just_audio: ^0.10.5
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/onnx/
    - assets/voice_styles/
